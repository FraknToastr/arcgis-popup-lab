<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Popup Live Bridge — Target Receiver</title>
  <link rel="stylesheet" href="styles.css?v=1.2.0">
  <style>
    .receiver-stage{position:relative;min-height:240px;display:grid;place-items:center;overflow:hidden;border:1px solid #315b78;border-radius:13px;background:radial-gradient(circle at 50% 30%,rgba(56,189,248,.18),transparent 42%),linear-gradient(145deg,#061324,#17072c)}
    .receiver-stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
    .receiver-value{position:relative;z-index:1;max-width:92%;padding:24px;color:white;font-size:clamp(28px,7vw,56px);font-weight:950;line-height:1.05;text-align:center;overflow-wrap:anywhere;text-shadow:0 0 12px #38bdf8,0 0 35px rgba(167,139,250,.7);transition:transform .28s ease,filter .28s ease,opacity .28s ease}
    .receiver-value.changed{transform:scale(1.08);filter:brightness(1.6);opacity:.84}
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="build">POPUP LIVE BRIDGE — TARGET 1.1</div>
    <h1>Layer B live popup receiver</h1>
    <p class="subtitle">Direct mode watches a FeatureServer attribute. Bridge mode watches shared persistent state for read-only or multipatch features.</p>

    <section class="section">
      <div class="receiver-stage"><div id="receiverValue" class="receiver-value">Waiting for Layer B…</div></div>
      <div id="receiverStatus" class="status">Receiver has not started.</div>
    </section>

    <section class="section">
      <h2>Connection</h2>
      <div class="panel">
        <label>Persistence mode
          <select id="targetMode"><option value="direct">Direct FeatureServer attribute</option><option value="bridge">Bridge-table popup state</option></select>
        </label>
        <div id="directTargetFields" class="field-grid two" style="margin-top:10px;">
          <label>Target feature layer URL<input id="targetService" type="url" spellcheck="false"></label>
          <label>Display field<input id="targetField" type="text" spellcheck="false"></label>
          <label>Object ID<input id="targetOid" type="number" step="1"></label>
          <label>Object ID field<input id="targetOidField" type="text" spellcheck="false" placeholder="Auto-detect"></label>
        </div>
        <div id="bridgeTargetFields" class="field-grid two" style="margin-top:10px;">
          <label>Live bridge table URL<input id="liveTable" type="url" spellcheck="false"></label>
          <label>Logical layer key<input id="targetLayerKey" type="text" spellcheck="false"></label>
          <label>Selected feature key<input id="targetKey" type="text" spellcheck="false"></label>
          <label>Feature key field<input id="targetKeyField" type="text" spellcheck="false"></label>
          <label>Popup display field name<input id="bridgeDisplayField" type="text" spellcheck="false"></label>
        </div>
        <label style="margin-top:10px;">Poll interval (ms)<input id="pollMs" type="number" min="500" max="60000" step="100"></label>
        <div class="actions"><button id="receiverToggle" type="button" class="good">Start receiver</button><button id="receiverNow" type="button" class="secondary">Refresh now</button></div>
        <dl id="receiverDetails" class="kv" style="margin-top:12px;"></dl>
      </div>
    </section>

    <section class="section"><h2>ArcGIS authentication</h2><div class="panel"><div id="authHost"></div></div></section>
  </main>

  <script src="config.js?v=1.2.0"></script>
  <script src="common.js?v=1.2.0"></script>
  <script src="arcgis-rest.js?v=1.2.0"></script>
  <script src="auth.js?v=1.2.0"></script>
  <script src="target-popup.js?v=1.2.0"></script>
</body>
</html>
