<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="REPAIR REQUIRED">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#f72585" stop-opacity="0.34"/><stop offset="1" stop-color="#f72585" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#f72585"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="720" height="180" rx="18" fill="#240812"/>
  <rect x="2" y="2" width="716" height="176" rx="16" fill="none" stroke="#f72585" stroke-opacity="0.64" stroke-width="3"/>
  <circle cx="96" cy="90" r="68" fill="url(#halo)"/>
  <circle cx="96" cy="90" r="36" fill="none" stroke="#f72585" stroke-width="4" stroke-dasharray="10 8">
    <animateTransform attributeName="transform" type="rotate" from="0 96 90" to="360 96 90" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="90" r="16" fill="#f72585" fill-opacity="0.24" stroke="#f72585" stroke-width="3">
    <animate attributeName="r" values="11;23;11" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.12;0.48;0.12" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="170" y="78" fill="#f72585" font-family="Arial, sans-serif" font-size="15" font-weight="800">LARKGIS STATUS MODULE</text>
  <text x="170" y="116" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="31" font-weight="900">REPAIR REQUIRED</text>
  <path d="M170 138H664" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 42">
    <animate attributeName="stroke-dashoffset" from="0" to="-324" dur="1.1s" repeatCount="indefinite"/>
  </path>
</svg>
